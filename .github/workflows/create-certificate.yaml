name: Create Certificate
on:
  push:
    paths:
      - hosts/**
jobs:
  sign_csr:
    name: Sign CSR
    runs-on: ubuntu-latest
    env:
      host: testhost
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Read configuration
        id: config
        run: |
          echo "fqdn=$(cat hosts/${{ env.host }}/${{ env.host }}.yaml | yq '.fqdn')" >> "$GITHUB_OUTPUT"
          echo "ca=$(cat hosts/${{ env.host }}/${{ env.host }}.yaml | yq '.certificate.ca')" >> "$GITHUB_OUTPUT"
          echo "days=$(cat hosts/${{ env.host }}/${{ env.host }}.yaml | yq '.certificate.valid_days')" >> "$GITHUB_OUTPUT"
      - name: Print FQDN
        run: echo "${{ steps.config.outputs.fqdn }}"
      - name: Get CA key
        env:
          CA_KEY: ${{ secrets.CA_KEY }}
          CA_HOME: "ca/${{ steps.config.outputs.ca }}"
        run: |
          mkdir -p "$CA_HOME/private"
          echo $CA_KEY > "$CA_HOME/private/key.pem"
          chmod 600 "$CA_HOME/private/key.pem"
      - name: Sign certificate
        env:
          CA_KEY_SECRET: ${{ secrets.CA_KEY_SECRET }}
          CA_HOME: "ca/${{ steps.config.outputs.ca }}"
        run: |
          ls -la "$CA_HOME/private/key.pem"
          openssl ca \
            -config "ca/openssl.cnf" \
            -name "${{ steps.config.outputs.ca }}_ca" \
            -passin "env:CA_KEY_SECRET" \
            -in "hosts/${{ env.host }}/${{ env.host }}.csr" \
            -out "hosts/${{ env.host }}/${{ env.host }}.pem"
      - name: Remove key
        run: rm "$CA_HOME/private/key.pem"
      - name: Create chained certificate
        env:
          CA_HOME: "ca/${{ steps.config.outputs.ca }}"
        run: |
          cat hosts/${{ env.host }}/${{ env.host }}.pem >> hosts/${{ env.host }}/certificate-chain.pem
          cat "$CA_HOME/certs/intermediate.pem" >> hosts/${{ env.host }}/certificate-chain.pem
      - name: Save bundle
        uses: actions/upload-artifact@v4
        with:
          name: certificate-bundle
          path: |
            hosts/${{ env.host }}/${{ env.host }}.pem
            ca/${{ steps.config.outputs.ca }}/certs/intermediate.pem
            hosts/${{ env.host }}/certificate-chain.pem

